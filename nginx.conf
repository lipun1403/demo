events { }

http {
    # This block defines your group of Node.js servers
    upstream node_apps {
        server app1:3001;
        server app2:3002;
        server app3:3003;
    }

    server {
        # NGINX listens on standard HTTP port 80
        listen 80;

        location / {
            # NGINX forwards all requests to the "node_apps" group above
            proxy_pass http://node_apps;
        }
    }
}